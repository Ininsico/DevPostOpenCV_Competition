[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herdwatch"
version = "0.1.0"
description = "HerdWatch — dairy cow lameness risk alerts from barn video via OpenCV 5 quantitative gait analysis and a self-built agentic closed loop"
readme = "README.md"
requires-python = "==3.12.*"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The HerdWatch authors" }]
keywords = ["opencv", "computer-vision", "animal-welfare", "dairy", "lameness", "agentic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime dependencies. OpenCV is headless everywhere: we never call cv2.imshow()
# (evidence is written as mp4), and the same package ships to Lambda arm64.
dependencies = [
  "opencv-python-headless==5.0.0.93",
  "numpy>=2.0,<3",
  "PyYAML>=6.0.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# The cloud path. moto[server] provides the fake-AWS endpoint used by the contract test.
aws = [
  "boto3>=1.35",
  "moto[server]>=5.0",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "matplotlib>=3.9",
]

[project.scripts]
herdwatch = "herdwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/herdwatch"]

[tool.hatch.build.targets.sdist]
include = ["src/herdwatch", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["frontend", "data", "artifacts", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
  "contract: drives real boto3 calls against a moto_server endpoint",
  "slow: takes more than a few seconds (eval, bench, full-clip analysis)",
]
