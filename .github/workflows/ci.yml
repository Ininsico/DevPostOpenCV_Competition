name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + tests (py3.12, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3.12 everywhere: matches the Lambda runtime and avoids uncertain
      # numpy/opencv wheel coverage on newer interpreters.
      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Show resolved OpenCV version
        run: uv run python -c "import cv2, numpy; print('opencv', cv2.__version__); print('numpy', numpy.__version__)"
